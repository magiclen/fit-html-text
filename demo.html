<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- <script src="https://cdn.jsdelivr.net/gh/magiclen/fit-html-text/dist/fit-html-text.min.js"></script> -->
        <script src="./dist/fit-html-text.min.js"></script>
        <title>fit-html-text</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>

    <body class="p-3 p-lg-5">
        <div id="demo-fit-html-text" class="container">
            <div class="row g-3">
                <div class="col-12">
                    <label for="text" class="form-label">Text</label>
                    <input
                        type="text"
                        id="text"
                        class="form-control"
                        style="height: 80px"
                        value="This is an apple."
                    />
                </div>
                <div class="col-12">
                    <span id="line" class="border d-block w-100"></span>
                </div>
                <div class="col-12">
                    <span
                        id="lines"
                        class="border d-block text-break w-100"
                        style="height: 300px"
                    ></span>
                </div>
            </div>
        </div>

        <script>
            const inputText = document.getElementById("text");

            const line = document.getElementById("line");
            const lines = document.getElementById("lines");

            const updateText = () => {
                const text = inputText.value.trim();

                line.textContent = text;
                lines.textContent = text;
            };

            inputText.addEventListener("input", updateText);

            updateText();

            // The input has a fixed height, so its text should not be taller than its content box.
            const inputStyle = getComputedStyle(inputText);

            FitHtmlText.autoFitText(inputText, {
                maxHeight:
                    inputText.clientHeight -
                    parseFloat(inputStyle.paddingTop) -
                    parseFloat(inputStyle.paddingBottom),
            });
            FitHtmlText.autoFitText(line);
            FitHtmlText.autoFitText(lines, {
                multiline: true,
            });
        </script>
    </body>
</html>
